spring.application.name=arguspay-core

spring.datasource.url=jdbc:postgresql://localhost:5432/arguspay
spring.datasource.username=arguspay
spring.datasource.password=arguspay

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

arguspay.jwt.secret=${ARGUSPAY_JWT_SECRET:dev-only-secret-change-in-production-32chars}
arguspay.jwt.expiration-minutes=60

arguspay.rate-limit.auth-per-minute=10
arguspay.rate-limit.api-per-minute=60